data:
  random_seed: 12345
  input_files: "/ceph/cms/store/user/aaarora/tracking/*.root"
  data_dir: "/ceph/cms/store/user/aaarora/tracking/data"
  train_split: 0.6
  val_split: 0.2
  test_split: 0.2

model:
  hidden_dims: [256, 128, 64, 32]
  residual_dim: 32
  dropout: 0.1
  n_res_blocks: 3
  use_calibration: true

trainer:
  accelerator: auto
  devices: 1
  log_every_n_steps: 50
  deterministic: true
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4  

training:
  loss_fn: BCEWithLogitsLoss
  learning_rate: 0.0001
  batch_size: 16384
  max_epochs: 50
  num_workers: 4

  scheduler:
    milestones: [35, 40, 45]
    gamma: 0.8
    monitor: val_loss
    interval: epoch
    frequency: 1

callbacks:
  checkpoint:
    save_top_k: 3
    monitor: val_loss
    mode: min
    every_n_train_steps: 500
  
  early_stopping:
    monitor: val_loss
    patience: 5
    mode: min

logger:
  save_dir: output/

analysis:
  target_recall: 0.995
  correlation_top_n: 5
  robustness_noise_levels: [0.01, 0.05, 0.1]
  robustness_n_samples: 1000
  robustness_batch_size: 16384
  shap_max_samples: 10000
  shap_batch_size: 16384